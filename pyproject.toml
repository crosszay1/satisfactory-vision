[project]
name = "satisfactory-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Isaiah Freundlich", email = "isaiahbfreundlich@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "torch>=2.14.0",
]

[project.scripts]
satisfactory-vision = "satisfactory_vision:main"
noise = "experimentation.gaussian_noise:main"
vae = "experimentation.vae_encoder:main"
train-vae = "satisfactory_vision.train_vae:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
